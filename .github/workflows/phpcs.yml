name: PHP CodeSniffer

on:
  pull_request:
    branches: [ trunk ]

jobs:
  phpcs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      # Without this step the job takes the runner image's PHP, which changes
      # with ubuntu-latest, and composer.lock has to install on it. Same action
      # and commit as unittest.yml.
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: "8.5"
          coverage: none

      - name: Install dependencies
        run: composer install

      - name: Run PHP CodeSniffer
        run: composer run phpcs
